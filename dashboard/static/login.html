<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In | Binnen Catalog OS</title>
  
  <!-- Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --bg-base: #040711;
      --bg-surface: rgba(11, 17, 32, 0.85);
      --bg-card: rgba(15, 23, 42, 0.75);
      --bg-input: rgba(4, 7, 17, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(99, 102, 241, 0.4);
      --indigo-500: #6366f1;
      --indigo-600: #4f46e5;
      --cyan-400: #22d3ee;
      --purple-500: #a855f7;
      --emerald-400: #34d399;
      --rose-500: #f43f5e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --font-sans: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Ambient Background Glow Elements */
    .ambient-bg {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }

    .glow-sphere-1 {
      position: absolute;
      top: -15%;
      left: -10%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(99, 102, 241, 0) 70%);
      filter: blur(60px);
      animation: floatOrb 12s ease-in-out infinite alternate;
    }

    .glow-sphere-2 {
      position: absolute;
      bottom: -15%;
      right: -10%;
      width: 650px;
      height: 650px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, rgba(6, 182, 212, 0) 70%);
      filter: blur(70px);
      animation: floatOrb 15s ease-in-out infinite alternate-reverse;
    }

    .glow-sphere-3 {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.1) 0%, rgba(168, 85, 247, 0) 70%);
      filter: blur(80px);
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 40%, transparent 80%);
    }

    @keyframes floatOrb {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(40px) scale(1.1); }
    }

    /* Login Card Container */
    .login-container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }

    .login-card {
      background: var(--bg-surface);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(99, 102, 241, 0.2);
      animation: cardAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Brand Header */
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-shield {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px auto;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #06b6d4 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 24px;
      color: #fff;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.45);
      position: relative;
    }

    .brand-shield::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,0.4), transparent);
      z-index: -1;
    }

    .login-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .login-title .badge-tag {
      font-size: 11px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--indigo-500), var(--cyan-400));
      padding: 2px 8px;
      border-radius: 6px;
      color: #fff;
      letter-spacing: 0.5px;
    }

    .login-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    /* Error Notification Banner */
    .alert-banner {
      background: rgba(244, 63, 94, 0.12);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fecdd3;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      animation: shake 0.35s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .alert-banner.active {
      display: flex;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--text-dim);
      pointer-events: none;
      transition: color 0.2s;
    }

    .form-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 12px 14px 12px 42px;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 14px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
    }

    .form-input:focus {
      border-color: var(--indigo-500);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25), 0 0 20px rgba(99, 102, 241, 0.15);
      background: rgba(8, 13, 28, 0.9);
    }

    .form-input:focus + .input-icon,
    .input-wrapper:focus-within .input-icon {
      color: var(--cyan-400);
    }

    .btn-toggle-pw {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s;
    }

    .btn-toggle-pw:hover {
      color: #fff;
    }

    /* Extras Row */
    .form-extras {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      font-size: 12px;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-label input[type="checkbox"] {
      accent-color: var(--indigo-500);
      width: 15px;
      height: 15px;
      cursor: pointer;
    }

    .security-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      color: var(--emerald-400);
      font-size: 11px;
      font-weight: 600;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 50%, #06b6d4 100%);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 13px 20px;
      color: #fff;
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 32px rgba(99, 102, 241, 0.55), 0 0 20px rgba(6, 182, 212, 0.3);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer Info */
    .login-footer {
      text-align: center;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
      font-size: 11px;
      color: var(--text-dim);
    }

    .connected-stores {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
    }

    .store-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-subtle);
      padding: 3px 8px;
      border-radius: 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: #94a3b8;
    }

    .dot-green {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--emerald-400);
      box-shadow: 0 0 6px var(--emerald-400);
    }
  </style>
</head>
<body>
  <div class="ambient-bg">
    <div class="grid-overlay"></div>
    <div class="glow-sphere-1"></div>
    <div class="glow-sphere-2"></div>
    <div class="glow-sphere-3"></div>
  </div>

  <div class="login-container">
    <div class="login-card">
      <header class="login-header">
        <div class="brand-shield">B</div>
        <h1 class="login-title">
          BINNEN <span class="badge-tag">OS</span>
        </h1>
        <p class="login-subtitle">Enterprise Catalog &amp; Storefront Intelligence</p>
      </header>

      <!-- Dynamic Alert Banner -->
      <div class="alert-banner" id="alertBanner">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="alertMsg">Invalid credentials. Please try again.</span>
      </div>

      <!-- Secure Form -->
      <form id="loginForm" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="email">Administrator Email</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" class="form-input" placeholder="Email...." required autocomplete="email" autofocus />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <svg class="input-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="btn-toggle-pw" id="togglePwBtn" onclick="togglePasswordVisibility()" title="Show/Hide password">
              <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="form-extras">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMe" checked />
            <span>Remember session</span>
          </label>

        </div>

        <button type="submit" class="btn-submit" id="submitBtn">
          <span id="btnText">Sign In to Catalog OS</span>
          <div class="spinner" id="btnSpinner"></div>
          <svg id="btnArrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <footer class="login-footer">
        <div>Protected Multi-Storefront Node</div>
        <div class="connected-stores">
          <span class="store-pill"><span class="dot-green"></span> Baserow Catalog</span>
          <span class="store-pill"><span class="dot-green"></span> Shopify Woonbloq</span>
        </div>
      </footer>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const pwInput = document.getElementById("password");
      const eyeIcon = document.getElementById("eyeIcon");
      if (pwInput.type === "password") {
        pwInput.type = "text";
        eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
      } else {
        pwInput.type = "password";
        eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
      }
    }

    async function handleLoginSubmit(event) {
      event.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const alertBanner = document.getElementById("alertBanner");
      const alertMsg = document.getElementById("alertMsg");
      const submitBtn = document.getElementById("submitBtn");
      const btnText = document.getElementById("btnText");
      const btnSpinner = document.getElementById("btnSpinner");
      const btnArrow = document.getElementById("btnArrow");

      // Reset alert
      alertBanner.classList.remove("active");

      // UI Loading state
      submitBtn.disabled = true;
      btnText.textContent = "Authenticating...";
      btnSpinner.style.display = "block";
      btnArrow.style.display = "none";

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await response.json();

        if (response.ok && data.ok) {
          btnText.textContent = "Access Granted";
          setTimeout(() => {
            window.location.href = data.redirect || "/";
          }, 400);
        } else {
          alertMsg.textContent = data.detail || "Invalid email or password.";
          alertBanner.classList.add("active");
          submitBtn.disabled = false;
          btnText.textContent = "Sign In to Catalog OS";
          btnSpinner.style.display = "none";
          btnArrow.style.display = "block";
          document.getElementById("password").focus();
        }
      } catch (err) {
        alertMsg.textContent = "Connection error. Please verify server status.";
        alertBanner.classList.add("active");
        submitBtn.disabled = false;
        btnText.textContent = "Sign In to Catalog OS";
        btnSpinner.style.display = "none";
        btnArrow.style.display = "block";
      }
    }
  </script>
</body>
</html>
